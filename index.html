<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do número secreto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="container__informacoes">
            <h1>Adivinhe o <span class="container__texto-azul">número secreto</span></h1>
            <p id="mensagem" class="texto__paragrafo" aria-live="polite">Escolha um número entre 1 e 10</p>

            <label for="chute" class="sr-only">Seu chute</label>
            <input id="chute" class="container__input" type="number" min="1" max="10" inputmode="numeric" autocomplete="off">

            <div class="container__botoes">
                <button id="chutar" class="container__botao" type="button">Chutar</button>
                <button id="reiniciar" class="container__botao" type="button" disabled>Novo jogo</button>
            </div>

            <p id="tentativas" class="texto__tentativas">Tentativas: 0</p>
        </section>

        <img class="container__imagem-pessoa" src="img/ia.png" alt="Ilustração de uma astronauta olhando para a esquerda">
    </main>

    <script src="app.js" defer></script>
</body>
</html>
